[package]
name = "pyoxide-ide"
description = "Compatibility entry point for oxshift-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "pyoxide-ide"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["runtime-shaders"]
runtime-shaders = ["product/runtime-shaders"]

[dependencies]
product = { package = "oxshift-python", path = "../oxshift-python", default-features = false }
